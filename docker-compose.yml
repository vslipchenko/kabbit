# Infrastructure plus the services built so far (one shared Dockerfile).
name: kabbit

services:
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9094:9094" # EXTERNAL listener, for clients on the host
    environment:
      # Single node in KRaft mode: broker and controller in one process, no ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Base64-encoded UUID; generate a new one with: kafka-storage.sh random-uuid
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

      # Where Kafka binds (all interfaces) vs. the address it tells clients to use.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # One broker, so internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Topics are created explicitly, with deliberate partition counts.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Don't wait 3s before the first consumer group rebalance (dev convenience).
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # One-shot: creates the topics, then exits. Auto-creation is off, so partition counts are chosen
  # here on purpose: they cap how many consumers of one group can work in parallel, and the
  # count can only ever grow (which remaps keys to partitions).
  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$1" --partitions "$$2" --replication-factor 1
        }
        # Normalized channel bookings, keyed by propertyId: 3 partitions, so up to 3 parallel consumers per group.
        create channel.reservations 3
        # Dead-letter topic: messages a consumer can never process, parked for inspection.
        create channel.reservations.dlt 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kabbit
      # Internal listener: inside this container, localhost is kafka-ui itself.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    environment:
      # The built-in guest user only accepts connections from localhost inside the container.
      RABBITMQ_DEFAULT_USER: kabbit
      RABBITMQ_DEFAULT_PASS: kabbit
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:17
    ports:
      # Host port 5433: a native Windows Postgres often already holds 5432, and connections from
      # the host would silently reach it instead. Containers still use postgres:5432.
      - "5433:5432"
    environment:
      POSTGRES_USER: kabbit
      POSTGRES_PASSWORD: kabbit
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only when postgres-data is empty. After editing init.sql: docker compose down -v
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kabbit"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Services ---------------------------------------------------------------------------

  housekeeping-svc:
    build:
      context: .
      args:
        SERVICE: housekeeping-svc
    ports:
      - "3006:3006"
    environment:
      # Inside the compose network: service names, container ports.
      RABBITMQ_URL: amqp://kabbit:kabbit@rabbitmq:5672
      DATABASE_URL: postgres://kabbit:kabbit@postgres:5432/housekeeping
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  channel-svc:
    build:
      context: .
      args:
        SERVICE: channel-svc
    ports:
      - "3010:3010"
    environment:
      DATABASE_URL: postgres://kabbit:kabbit@postgres:5432/channel
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      # The topics must exist before anything publishes or subscribes.
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3010/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Plays Airbnb and Booking.com: curl -X POST "localhost:3011/simulate?count=10"
  channel-simulator:
    build:
      context: .
      args:
        SERVICE: channel-simulator
    ports:
      - "3011:3011"
    environment:
      CHANNEL_SVC_URL: http://channel-svc:3010
    depends_on:
      channel-svc:
        condition: service_healthy

  analytics-svc:
    build:
      context: .
      args:
        SERVICE: analytics-svc
    # A host port range, so `docker compose up -d --scale analytics-svc=3` works: each replica
    # takes the next free port. With 3 partitions, a 4th replica would sit idle.
    ports:
      - "3020-3023:3005"
    environment:
      DATABASE_URL: postgres://kabbit:kabbit@postgres:5432/analytics
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    # Replicas started together can race to run the migration; a loser exits and is restarted.
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  kafka-data:
  rabbitmq-data:
  postgres-data:
